workflows:
  android-workflow:
    name: Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android folder
        script: |
          flutter create . --platforms=android --org com.ehliyet.app --project-name ehliyet_2026
          git checkout -- lib/main.dart
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
