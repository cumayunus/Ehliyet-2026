workflows:
  android-workflow:
    name: CUMA SINAV Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set App Name
        script: |
          echo "Setting app name to CUMA SINAV"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK with CUMA SINAV name
        script: |
          flutter build apk --release --build-name="CUMA SINAV" --build-number=1
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/AABs/*.aab
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - user@example.com