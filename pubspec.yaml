name: cuma_sinav
description: CUMA SINAV - Ehliyet Sinav Uygulamasi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.0
  youtube_player_flutter: 9.0.0
  flutter_inappwebview: ^6.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#C62828"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

dependency_overrides:
  flutter_inappwebview: ^6.0.0
  flutter_inappwebview_android: ^1.1.3